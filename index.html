  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-dia-semana { font-size: 0.75rem; color: #64748b; font-weight: bold; margin-bottom: 0.5rem; }

  .cal-dia:hover { background: #f1f5f9; } .cal-dia.vazio { cursor: default; } .cal-dia.vazio:hover { background: none; }
  .cal-dia.hoje { font-weight: bold; border: 1px solid #1e3a5f; } .cal-dia.selecionado { background: #1e3a5f; color: white; }

  .card-resumo-dia { background: white; border-radius: 8px; padding: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-top: 4px solid #1e3a5f; }

  .resumo-turnos { display: flex; justify-content: space-around; text-align: center; }
  .resumo-turno-item { display: flex; flex-direction: column; align-items: center; }
  .resumo-turno-item span { font-size: 0.8rem; color: #64748b; margin-bottom: 0.2rem; text-transform: uppercase; font-weight: bold; }
  .resumo-turno-item strong { font-size: 1.5rem; color: #333; }
  .resumo-turno-item.lotado strong { color: #ef4444; }
  
  .barra-acoes { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px; }

  .btn-importar { background: #f59e0b; color: white; border: none; padding: 0.8rem 1.5rem; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }

  .btn-limpar-filtro { background: #e2e8f0; color: #475569; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; margin-left: 10px; display: none; }

  th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; }

<header>
  <h1>Gestão de Intimações</h1>
  <span id="data-hoje"></span>
</header>

<main>
  <div class="titulo-mes-container">
    <h2 id="mes-evidencia">Carregando...</h2>
  </div>

  <div class="dashboard">
    <div class="card-indicador total"><h3>Total no Mês</h3><p class="numero" id="ind-total">0</p></div>
    <div class="card-indicador agendado"><h3>Aguardando</h3><p class="numero" id="ind-agendado">0</p></div>
    <div class="card-indicador compareceu"><h3>Compareceram</h3><p class="numero" id="ind-compareceu">0</p></div>
    <div class="card-indicador faltou"><h3>Faltaram</h3><p class="numero" id="ind-faltou">0</p></div>
  </div>

  <div class="layout-principal">
    <aside class="coluna-esquerda">
      <div class="card-calendario">
        <div class="cal-header">
          <button onclick="mudarMes(-1)">&#10094;</button>
          <span id="cal-mes-ano">...</span>
          <button onclick="mudarMes(1)">&#10095;</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
      <div class="card-resumo-dia" id="painel-resumo" style="display: none;">
        <h4 id="resumo-data-titulo">Resumo do Dia</h4>
        <div class="resumo-turnos">
          <div class="resumo-turno-item" id="resumo-manha"><span>Manhã</span><strong>0/4</strong></div>
          <div style="width: 1px; background: #eee;"></div>
          <div class="resumo-turno-item" id="resumo-tarde"><span>Tarde</span><strong>0/4</strong></div>
        </div>
      </div>
    </aside>

    <section>
      <div class="barra-acoes">
        <div style="display: flex; align-items: center;">
          <h2 id="titulo-lista">Intimações do Mês</h2>
          <button class="btn-limpar-filtro" id="btn-limpar-filtro" onclick="limparFiltro()">Limpar Filtro</button>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn-importar" onclick="importarTudo()">🚀 Importar Agendamentos</button>
          <button class="btn-novo" onclick="abrirModal()">+ Novo Agendamento</button>
        </div>
      </div>

      <div class="card-tabela">
        <table>
          <thead>
            <tr><th>Data / Hora</th><th>Processo</th><th>OIP</th><th>Intimado</th><th>Status</th><th>Ações</th></tr>
          </thead>
          <tbody id="tabela-corpo"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<!-- MODAL DE NOVO AGENDAMENTO -->
<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <h2>Novo Agendamento</h2>
    <form id="form-agendamento">
      <input type="text" name="processo" placeholder="Nº do Processo (ex: IP 319-207/2023)" required>
      <div style="display: flex; gap: 1rem;">
        <input type="text" name="oip" placeholder="Nome do OIP" required style="flex: 1;">
        <input type="text" name="intimado" placeholder="Nome do Intimado" required style="flex: 1;">
      </div>
      <div class="linha-inputs">
        <input type="date" name="data" required id="input-data">
        <input type="time" name="hora" required id="input-hora" onchange="detectarTurnoVisual()">
        <select name="turno" id="input-turno" required>
          <option value="manha">Manhã</option>
          <option value="tarde">Tarde</option>
        </select>
      </div>
      <div class="modal-botoes">
        <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
        <button type="submit" class="btn-salvar">Salvar</button>
      </div>
    </form>
  </div>
</div>

      const [data, hora, turno, processo, oip, intimado, status] = colunas;

        data: data.trim(),
        hora: hora.trim(),
        turno: turno.trim().toLowerCase(),
        processo: processo.trim(),
        oip: oip.trim(),
        intimado: intimado.trim(),
        status: status.trim().toLowerCase(),
        criadoEm: new Date().toISOString()
      });
      importados++;
    }

    alert(`✅ ${importados} agendamentos importados com sucesso!`);
